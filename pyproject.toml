[project]
name = "ha_foobar2k"
version = "0.0.1"
description = "Foobar2000 media player control in Home Assistant - play your music like it is 1999!"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "pyfoobar2k==0.2.8",
]

# Installed on top of the Home Assistant image (see .devcontainer/Dockerfile).
# pytest-homeassistant-custom-component pins homeassistant, so it must match the image tag.
[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.373",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = [".git", "config"]
pythonpath = "."
filterwarnings = [
    # Fail on warnings raised by this integration only; HA core emits its own deprecations.
    "error:::custom_components\\.foobar2000",
    # Never-awaited coroutines are reported from wherever they get collected, not from our module
    "error::RuntimeWarning",
]
